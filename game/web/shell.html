#load.done { opacity: 0; pointer-events: none; }
.top { position: absolute; top: 6vh; left: 0; right: 0; text-align: center; }
.logo { font-family: Oswald, sans-serif; font-weight: 700; font-size: clamp(56px, 11vw, 150px); letter-spacing: .04em; line-height: 1;
  text-shadow: 0 8px 40px rgba(0,0,0,.6); }
.logo span { color: #2bdc7a; }
.tag { font-family: Oswald, sans-serif; font-size: clamp(14px, 2vw, 22px); letter-spacing: .35em; color: rgba(255,255,255,.75); margin-top: 6px; }
.ball { width: 56px; height: 56px; margin: 4vh auto 0; border-radius: 50%; background:
  radial-gradient(circle at 35% 30%, #fff 0 18%, #e9e9e9 40%, #b9b9b9 100%); position: relative; animation: spin 1.1s linear infinite, bounce .55s ease-in-out infinite alternate;
  box-shadow: 0 18px 22px -12px rgba(0,0,0,.7); }
.ball:after { content: ""; position: absolute; inset: 30%; background: #15171c; clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bounce { from { margin-top: 4vh; } to { margin-top: calc(4vh - 14px); } }
.panel { margin: 0 auto 6vh; width: min(760px, 88vw); }
.stages { display: flex; gap: 8px; margin-bottom: 14px; }
.st { flex: 1; font-family: Oswald, sans-serif; font-size: clamp(11px, 1.4vw, 15px); letter-spacing: .06em; color: rgba(255,255,255,.35);
  border-top: 3px solid rgba(255,255,255,.15); padding-top: 6px; transition: .3s; }
.st.on { color: #ffc93d; border-color: #ffc93d; }
.st.ok { color: #2bdc7a; border-color: #2bdc7a; }
.row { display: flex; justify-content: space-between; align-items: baseline; font-family: Oswald, sans-serif; }
#stage { font-size: clamp(18px, 2.6vw, 28px); }
#pct { font-size: clamp(22px, 3.2vw, 34px); color: #ffc93d; }
.bar { height: 12px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; margin: 8px 0 6px; }
#fill { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, #ff9f0a, #ffd24a); box-shadow: 0 0 18px rgba(255,190,40,.6); transition: width .25s; }
#fill.ind { width: 35% !important; animation: ind 1.2s ease-in-out infinite; }
@keyframes ind { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
.meta { display: flex; justify-content: space-between; font-size: 13px; color: rgba(255,255,255,.55); }
#tip { margin-top: 18px; min-height: 44px; font-size: clamp(13px, 1.7vw, 16px); color: rgba(255,255,255,.8); text-align: center; transition: opacity .4s; }
#tip b { color: #2bdc7a; font-weight: 600; }
#err { display: none; color: #ff8a80; text-align: center; margin-top: 10px; white-space: pre-line; }

<script>
const GODOT_CONFIG = $GODOT_CONFIG;

(function () {

  const S = T || { st: ['Loading engine…', 'Loading stadium and players…', 'Starting engine…', 'Building lobby…', 'Ready!'], tips: ['<b>LMB</b> — shoot, <b>RMB</b> — pass'], mb: 'MB', tag: 'FOOTBALL', stages: ['1 · ENGINE', '2 · STADIUM', '3 · START', '4 · LOBBY'] };
  const $ = (id) => document.getElementById(id);

    for (let k = 0; k < 4; k++) $('s' + k).className = 'st' + (k < i ? ' ok' : (k === i ? ' on' : ''));

    $('pct').textContent = pct + '%';
    $('mb').textContent = (cur / 1048576).toFixed(1) + ' / ' + (tot / 1048576).toFixed(1) + ' ' + S.mb;

    if (dt > 0.5) {
      const sp = cur / dt;
      const left = (tot - cur) / Math.max(sp, 1);

  window.maydonReady = finish;
  window.maydonStage = function (i, pct) { setStage(i); if (pct) { $('fill').style.width = pct + '%'; $('pct').textContent = pct + '%'; } };
  function fail(err) {
    console.error(err);
    $('err').style.display = 'block';
    $('err').textContent = (err && err.message) ? err.message : String(err);
    $('stage').textContent = 'Error';
  }
  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    fail('Your browser is missing: ' + missing.join(', ') + '\nUse a recent Chrome, Edge or Firefox.');
    return;
  }
  setStage(0);
  engine.startGame({ onProgress: progress }).then(() => {
    setStage(2);
    $('fill').style.width = '94%';
    $('pct').textContent = '94%';
    $('speed').textContent = '';
    setTimeout(finish, 45000);   // safety net
  }, fail);
}());
</script>
</body>
</html>
